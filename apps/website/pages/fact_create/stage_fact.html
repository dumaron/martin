<tr>
    <td>
        {{ fact.subject }}
        <input type="hidden" name="facts" value="{{ fact.payload }}">
    </td>
    <td>{{ fact.predicate }}</td>
    <td>{{ fact.object }}</td>
    <td class="table-actions">
        <button type="button" hx-on:click="this.closest('tr').remove()">Remove</button>
    </td>
</tr>
