name: martin

services:
  martin:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file: .env.pi
    environment:
      DJANGO_ENVIRONMENT: prod
      ENVIRONMENT: production
      DATABASE_PATH: /storage/db/db.sqlite3
      ALLOWED_HOSTS: raspy,raspy.local,raspy.fritz.box
      CSRF_TRUSTED_ORIGINS: http://raspy,http://raspy.local,http://raspy.fritz.box
    volumes:
      - /home/duma/martin/storage:/storage
    logging:
      options:
        max-size: 10m
        max-file: "3"
